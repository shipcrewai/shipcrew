[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shipply"
version = "0.1.0"
description = "Shipply orchestration engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pacto-bot-sdk>=0.2.0",
    "pydantic>=2.0",
    "prometheus-client>=0.20",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "click>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    'tomli>=2.0.0; python_version<"3.11"',
]

[project.scripts]
shipply = "shipply.cli:main"
shipply-dashboard = "shipply.dashboard:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
